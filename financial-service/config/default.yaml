# ============================================
# 金融决策系统 - 默认配置
# ============================================

# 应用配置
app:
  name: "Financial Decision System"
  version: "1.0.0"
  debug: true
  host: "0.0.0.0"
  port: 8000

# LLM 配置
llm:
  # 默认提供商
  default_provider: "dashscope"

  # 各提供商的默认模型
  models:
    dashscope: "qwen-plus"
    deepseek: "deepseek-chat"
    google: "gemini-2.0-flash-exp"
    openai: "gpt-4o-mini"

  # 模型参数
  temperature: 0.7
  max_tokens: 2000
  top_p: 0.9

# 分析配置
analysis:
  # 默认分析深度 (1-5)
  default_depth: 3

  # 默认启用的智能体
  default_agents:
    - market
    - fundamental
    - news

  # 超时设置 (秒)
  timeout: 1800
  agent_timeout: 300

  # 辩论配置
  max_debate_rounds: 2
  debate_timeout: 300

# 数据源配置
data:
  # 数据源优先级
  sources:
    - yfinance
    - finnhub
    - akshare
    - tushare

  # 缓存配置
  cache:
    enabled: true
    ttl: 3600  # 1小时
    dir: "./data/cache"

# 缓存配置
cache:
  # 文件缓存
  file:
    enabled: true
    dir: "./data/cache"
    ttl: 3600

  # Redis (可选)
  redis:
    enabled: false
    host: "localhost"
    port: 6379
    db: 0

  # MongoDB (可选)
  mongodb:
    enabled: false
    host: "localhost"
    port: 27017
    database: "financial_db"

# 日志配置
logging:
  level: "INFO"
  dir: "./logs"
  max_size: 10485760  # 10MB
  backup_count: 5
